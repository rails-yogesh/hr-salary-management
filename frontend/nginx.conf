server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forward the original /api/v1/... path straight to the Rails backend —
    # proxy_pass has no path component here, so nginx preserves the request
    # URI unchanged. Deliberately no add_header directives here: Rails
    # already sets its own security headers on API responses (confirmed via
    # `curl -I`), and duplicating/overriding them risks sending two
    # different X-Frame-Options values on the same response, which browsers
    # handle inconsistently.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file route (e.g. /employees/42) is handled by
    # react-router client-side, so always serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;

        # Security review 2026-09-23 (SEC-M5): no security headers were set
        # anywhere in the stack for the pages the browser actually renders.
        # No active vulnerability required these (React's default JSX
        # escaping means there's no XSS sink in this app — confirmed by a
        # repo-wide grep), but they're defense-in-depth: if an XSS bug is
        # ever introduced, CSP blunts token exfiltration out of
        # localStorage, and X-Frame-Options stops the login page from being
        # framed for clickjacking. Scoped to this location (not server-wide)
        # so it doesn't touch /api/ responses, which Rails already headers.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;
    }
}
