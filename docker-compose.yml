services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salary_management_production
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: salary_management_production
      RAILS_LOG_TO_STDOUT: "1"
      FRONTEND_ORIGIN: http://localhost:8080
      # Insecure placeholder so `docker-compose up` works with zero setup.
      # Override with a real secret (`openssl rand -hex 64`) via a root
      # .env file for anything beyond a local demo.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-insecure_local_demo_secret_key_base_do_not_use_in_real_deployments_0000000000000000000000000000000000000000000000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-hr@acme.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme123!}
    depends_on:
      db:
        condition: service_healthy
    # No `ports:` mapping here on purpose (security review 2026-09-23,
    # SEC-M4): the documented architecture is "the browser only ever talks
    # to nginx on one origin" (docs/ARCHITECTURE.md) — publishing 3000
    # directly to the host let anything reachable on the host bypass nginx
    # entirely, undermining the one place future hardening (security
    # headers, a WAF rule, TLS termination) would live. The frontend
    # container still reaches this service by name (`backend:3000`) over
    # the internal compose network, which doesn't require a published port.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  db_data:
